# ADR-0013 Decisao 6 — default/defaultRequest para pods sem resources
# explicitos (ex.: containers do seed-job).
apiVersion: v1
kind: LimitRange
metadata:
  name: limits
  namespace: staging
spec:
  limits:
    - type: Container
      default:
        cpu: "100m"
        memory: "128Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      max:
        cpu: "500m"
        memory: "512Mi"
      min:
        cpu: "25m"
        memory: "32Mi"
