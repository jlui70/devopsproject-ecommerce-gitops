apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: dpe-stg-aws-secrets-manager-stg
  target:
    name: dpe-stg-app-secrets-stg
    creationPolicy: Owner
  dataFrom:
    # ADR-0012 — segredo(s) -stg no Secrets Manager (Aurora Serverless v2
    # gerenciado + DocumentDB -stg). Nome exato a confirmar contra a stack
    # `serverless` (envs/staging.tfvars) quando reaplicada; segue o mesmo
    # padrao de chave usado em producao (devopsproject/app/secrets), com
    # sufixo -stg.
    - extract:
        key: devopsproject/app/secrets-stg
