notificatorDeployment:
  image: 692430448478.dkr.ecr.us-east-1.amazonaws.com/devopsproject/prod/notificator
  containerPort: 4443
  nodePort: 30106
  configMap: dpe-stg-config-map-stg
  secret: dpe-stg-app-secrets-stg
  replicaCount: 1
  serviceAccount: dpe-stg-sa-stg
  imagePullSecrets: dpe-stg-ecr-image-pull-credentials-stg
  autoScaling:
    minReplicas: 1
    maxReplicas: 3
    averageCpuUtilization: 50
    # ADR-0007 — KEDA ScaledObject parameters (replaces hpa.yml)
    keda:
      # ADR-0012/0013 — fila -stg deste ambiente, nao a de producao.
      queueURL: https://sqs.us-east-1.amazonaws.com/692430448478/EmailNotificationQueue-stg
      # pollingInterval: how often KEDA polls SQS for ApproximateNumberOfMessages (seconds)
      pollingInterval: 30
      # cooldownPeriod: time to wait after last active trigger before scaling to minReplicas (seconds)
      cooldownPeriod: 120
      # queueLength: target messages per replica (scale-out trigger)
      queueLength: "10"
      # activationQueueLength: minimum queue depth to activate the ScaledObject
      activationQueueLength: "0"
    scaleDown:
      stabilizationWindowSeconds: 15
      policies:
      - type: Pods
        value: 2
        periodSeconds: 15
      - type: Percent
        value: 50
        periodSeconds: 15
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  volumes:
  - name: kestrel
    secret:
      secretName: dpe-stg-kestrel-certificate-stg
  volumeMounts: 
  - name: kestrel
    readOnly: true
    mountPath: /dpe-backend/certificates/kestrel
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  startupProbe:
    httpGet:
      path: /notificator/health
      port: 8080
      scheme: HTTP
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    httpGet:
      path: /notificator/health
      port: 8080
      scheme: HTTP
    successThreshold: 1
    failureThreshold: 3
    initialDelaySeconds: 0
    timeoutSeconds: 15
    periodSeconds: 60
  readinessProbe:
    httpGet:
      path: /notificator/health
      port: 8080
      scheme: HTTP
    successThreshold: 1
    failureThreshold: 3
    initialDelaySeconds: 3
    timeoutSeconds: 15
    periodSeconds: 3