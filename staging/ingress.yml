# ADR-0014 "Ingress de staging (pertence ao overlay staging/ - ADR-0013)" —
# ALB interno, cert wildcard *.ecommerce-devopsproject.com ja existente
# (ADR-0010, SAN cobre staging.*, nenhum ACM novo), DNS publicado pelo
# ExternalDNS (worker instance-role) a partir da anotacao de hostname —
# nenhum aws_route53_record estatico.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    # Mesmo certificado wildcard usado em production/infrastructure/ingress.yml
    # (ADR-0010) — cobre staging.ecommerce-devopsproject.com, nenhum ACM novo.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:692430448478:certificate/5c21c5e4-df1c-4f10-8c23-07b240d9a964
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/load-balancer-name: dpe-stg-ingress-stg
    alb.ingress.kubernetes.io/scheme: internal
    external-dns.alpha.kubernetes.io/hostname: staging.ecommerce-devopsproject.com
    alb.ingress.kubernetes.io/security-groups: ecommerce-devopsproject-cluster-alb,ecommerce-devopsproject-cluster-worker
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /healthchecks
            pathType: Prefix
            backend:
              service:
                name: dpe-stg-health-checker-stg
                port:
                  number: 4443
          - path: /identity
            pathType: Prefix
            backend:
              service:
                name: dpe-stg-identity-server-stg
                port:
                  number: 4443
          - path: /invoice
            pathType: Prefix
            backend:
              service:
                name: dpe-stg-invoice-generator-stg
                port:
                  number: 4443
          - path: /main
            pathType: Prefix
            backend:
              service:
                name: dpe-stg-main-stg
                port:
                  number: 4443
          - path: /notificator
            pathType: Prefix
            backend:
              service:
                name: dpe-stg-notificator-stg
                port:
                  number: 4443
          - path: /order
            pathType: Prefix
            backend:
              service:
                name: dpe-stg-order-stg
                port:
                  number: 4443
