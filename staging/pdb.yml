# ADR-0013 Decisao 5 — PDB minAvailable: 0 em staging (excecao normatizada,
# restrita a este overlay; nenhum PDB existe em production/ hoje — nao ha
# recurso base para "patchear" via kustomize patches, entao estes PDBs sao
# declarados diretamente aqui, um por app, selecionando pelo label `app` que
# o proprio Helm chart ja define (nao alterado, ver application/<app>/templates).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: health-checker
  namespace: staging
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: health-checker
