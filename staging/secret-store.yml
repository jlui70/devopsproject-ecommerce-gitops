apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # kubeadm self-managed (sem IRSA/EKS Pod Identity) - autenticacao pela
      # cadeia de credenciais padrao do SDK, que resolve para a instance-role
      # do worker EC2 (IMDS hop=2, ADR-0002/0007). Este SecretStore vive no
      # namespace staging (SecretStore e' namespaced, nao ClusterSecretStore)
      # e e' consumido apenas pelo ExternalSecret deste mesmo overlay, que
      # referencia SOMENTE ARNs -stg (ADR-0013 Decisao 3) — a policy da
      # instance-role deve permitir secretsmanager:GetSecretValue nos ARNs
      # -stg (ADR-0012) alem dos de producao.
