# ADR-0012 (dados sintéticos -stg) / ADR-0013 (hospeda o Job no overlay
# staging/, coberto pelo ResourceQuota/LimitRange). Job idempotente
# (TRUNCATE + INSERT) para Aurora Serverless v2 -stg e DocumentDB -stg.
#
# ATENÇÃO — pré-requisito de ordem (achado ao vivo em 2026-08-10, não corrigido
# automaticamente por sync-wave — decisão consciente, ver nota abaixo): este Job só
# tem chance de completar com sucesso DEPOIS que o serviço `order` de staging já
# subiu com uma imagem real (Fase 11/CI-CD) e rodou suas migrations pelo menos uma
# vez — é isso que cria a tabela `products` que o seed usa. Antes disso, o Job falha
# com "relation products does not exist", o que é esperado, não um bug de config.
# Reexecutar manualmente quando staging já estiver com os pods do app Running:
#   kubectl delete job -n staging dpe-stg-seed-postgres-stg dpe-stg-seed-mongo-stg
#   (nomes reais tem o prefixo/sufixo do kustomize, nao "seed-postgres"/"seed-mongo")
#   kubectl apply -f staging/seed-job.yml
# (Jobs do Kubernetes não são re-executados automaticamente pelo sync do ArgoCD
# depois de completar ou esgotar o backoffLimit — apagar e reaplicar é o padrão.
# Não usamos argocd.argoproj.io/hook aqui de propósito: um PostSync hook rodaria no
# mesmo sync que cria os Deployments, antes das migrations acontecerem de verdade —
# não resolveria a dependência de fato, só mudaria quando a falha aparece.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: seed-postgres-script
  namespace: staging
data:
  seed.sql: |
    -- Idempotente: TRUNCATE + INSERT. Dados sinteticos de lab (ADR-0012).
    -- TRUNCATE nao aceita "IF EXISTS" no Postgres (corrigido em 2026-08-10) --
    -- se a tabela nao existir ainda (app de staging sem migrations rodadas),
    -- o script falha aqui de proposito, com uma mensagem clara.
    TRUNCATE TABLE products RESTART IDENTITY CASCADE;
    INSERT INTO products (name, price, stock) VALUES
      ('Staging Sample Product 1', 19.90, 100),
      ('Staging Sample Product 2', 29.90, 50),
      ('Staging Sample Product 3', 9.90, 200);
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seed-mongo-script
  namespace: staging
data:
  seed.js: |
    // Idempotente: drop + insert. Dados sinteticos de lab (ADR-0012).
    db.reports.deleteMany({});
    db.reports.insertMany([
      { name: "staging-seed-report-1", createdAt: new Date(), synthetic: true },
      { name: "staging-seed-report-2", createdAt: new Date(), synthetic: true }
    ]);
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-postgres
  namespace: staging
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: seed-postgres
        application: devopsproject-ecommerce
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: seed-postgres
          image: postgres:16-alpine
          # Corrigido em 2026-08-10: PGPASSWORD nao existia (psql falhava sem senha
          # em modo nao-interativo). O secret dpe-stg-app-secrets-stg so tem a
          # connection string combinada em formato ADO.NET (User ID=...;Password=...),
          # que o psql nao entende nativamente (formato/palavras-chave diferentes do
          # libpq conninfo) — extraida aqui via shell antes de chamar psql.
          #
          # Corrigido em 2026-08-17: desde o fix de escaping do Npgsql (terraform
          # secrets.app.tf), o valor vem entre aspas duplas com aspas internas
          # duplicadas (Password="valor com "" se tiver aspas";), padrao ADO.NET —
          # o sed antigo (ate o primeiro ";") pegava a senha errada, incluindo as
          # aspas literais, gerando "password authentication failed" mesmo com a
          # senha certa no Secrets Manager. Extracao em 3 passos: (1) protege aspas
          # internas duplicadas com um marcador, (2) extrai entre as aspas restantes
          # (agora inequivocas), (3) desfaz o marcador.
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD=$(echo "$CONNECTIONSTRINGS__DEFAULT" \
                | sed 's/""/@@Q@@/g' \
                | sed -n 's/.*Password="\([^"]*\)".*/\1/p' \
                | sed 's/@@Q@@/"/g')
              exec psql -f /seed/seed.sql
          envFrom:
            - configMapRef:
                name: dpe-stg-config-map-stg
            - secretRef:
                name: dpe-stg-app-secrets-stg
          env:
            # PGHOST: endpoint do Aurora -stg, recalculado a cada rebuild do cluster
            # e sincronizado aqui pelo `sync-gitops-outputs.sh staging-pghost`, mesmo
            # padrao ja usado pro ARN do certificado ACM (RUNBOOK-deploy-do-zero.md).
            # O identificador do cluster (prefixo antes de ".cluster-") vem fixo do
            # Terraform; o sufixo "cluster-<hash>" e' estavel por conta/regiao AWS,
            # nao aleatorio por cluster — por isso o valor pode repetir identico
            # entre ciclos de teardown+rebuild (confirmado ao vivo em 2026-08-17: o
            # `sync-gitops-outputs.sh` rodou e reportou "nada mudou" porque o valor
            # do ciclo anterior ja batia byte a byte com o novo). Nao e' sinal de
            # falha do script nem de endpoint desatualizado.
            # NAO sensivel (nao e credencial), diferente de PGPASSWORD acima.
            - name: PGHOST
              value: "devopsproject-stg-aurora.cluster-ccf86y6syo4g.us-east-1.rds.amazonaws.com"
            - name: PGDATABASE
              value: "devopsprojectEcommerce"
            - name: PGUSER
              value: "devopsprojectAdmin"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: seed-script
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed-script
          configMap:
            name: dpe-stg-seed-postgres-script-stg
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-mongo
  namespace: staging
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: seed-mongo
        application: devopsproject-ecommerce
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: seed-mongo
          image: mongo:7
          # Corrigido em 2026-08-10: nao precisa de placeholder nenhum — o secret
          # dpe-stg-app-secrets-stg ja tem CONNECTIONSTRINGS__MONGO pronta em
          # formato mongodb:// URI (username/senha/host ja embutidos), diferente da
          # connection string do Postgres (formato ADO.NET, precisa de extracao).
          command: ["mongosh"]
          args:
            - "--tls"
            - "--tlsCAFile=/certs/certificate.pem"
            - "$(CONNECTIONSTRINGS__MONGO)"
            - "/seed/seed.js"
          envFrom:
            - configMapRef:
                name: dpe-stg-config-map-stg
            - secretRef:
                name: dpe-stg-app-secrets-stg
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              # Corrigido em 2026-08-10: 128Mi causava OOMKilled — o mongosh
              # moderno (cliente Node.js) precisa de mais memoria que o legado
              # `mongo` shell.
              memory: "192Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          volumeMounts:
            - name: seed-script
              mountPath: /seed
              readOnly: true
            - name: mongo-cert
              mountPath: /certs
              readOnly: true
      volumes:
        - name: seed-script
          configMap:
            name: dpe-stg-seed-mongo-script-stg
        - name: mongo-cert
          secret:
            secretName: dpe-stg-mongo-certificate-stg
