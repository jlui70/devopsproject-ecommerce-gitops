# ADR-0012 (dados sinteticos -stg) / ADR-0013 (hospeda o Job no overlay staging/,
# coberto pelo ResourceQuota/LimitRange) / ADR-0023 (PostSync hook + correcao do
# schema).
#
# DUAS CORRECOES DO ADR-0023 (2026-08-21):
#
# 1. O SQL apontava para uma tabela que nunca existiu. Fazia
#    `TRUNCATE TABLE products` e `INSERT INTO products (name, price, stock)`, mas o
#    schema real gerado pelas migrations do EF Core e' "Product" (Id, Name, Price)
#    mais uma tabela separada "Stock" (Id, ProductId, Quantity) — ver
#    src/domains/DevOpsProjectEcommerce.Shared/Repositories/Configurations/
#    ProductEntityTypeConfiguration.cs e .../Main.Domain/.../StockEntityTypeConfiguration.cs
#    no repositorio da aplicacao. Em Postgres, `products` sem aspas nem sequer resolve
#    para "Product" (o unquoted case-folding gera `products`, minusculo). O erro
#    `relation "products" does not exist` era atribuido a uma corrida com as
#    migrations, mas persistiria mesmo com as migrations concluidas.
#
# 2. Passa a ser um PostSync hook do ArgoCD. O cabecalho anterior registrava que o
#    hook tinha sido evitado de proposito, com a justificativa de que "um PostSync
#    hook rodaria no mesmo sync que cria os Deployments, antes das migrations
#    acontecerem de verdade". Isso vale para hooks PreSync e Sync, mas nao para
#    PostSync: o ArgoCD so' dispara a fase PostSync depois de todos os recursos do
#    sync estarem Synced E Healthy, e a saude de um Deployment/Rollout depende da
#    readiness probe passar — o que so' acontece depois de dbContext.Database.Migrate()
#    completar no startup (Main/Modules/InfrastructureModule.cs). Com
#    hook-delete-policy: BeforeHookCreation, o Job e' recriado a cada sync em vez de
#    ficar preso no estado terminal do primeiro run, o que elimina o passo manual
#    `kubectl delete job ...` + refresh (antiga Fase 11.8 do runbook).
#
# O SQL e o JS abaixo sao idempotentes por construcao (INSERT ... WHERE NOT EXISTS e
# updateOne com upsert), nao por TRUNCATE/deleteMany — rodar a cada sync nao pode
# apagar dado de ninguem que esteja usando o ambiente de staging.
apiVersion: v1
kind: ConfigMap
metadata:
  name: seed-postgres-script
  namespace: staging
data:
  seed.sql: |
    -- Schema real (EF Core): "Product"(Id, Name, Price) e "Stock"(Id, ProductId,
    -- Quantity). Nomes entre aspas duplas porque o EF cria os identificadores em
    -- PascalCase e o Postgres faz case-folding para minusculo sem elas.
    --
    -- Idempotente sem TRUNCATE: roda a cada sync do ArgoCD (PostSync hook) e nunca
    -- apaga dados existentes.
    INSERT INTO "Product" ("Name", "Price")
    SELECT v.name, v.price
    FROM (VALUES
      ('Staging Sample Product 1', 19.90::numeric),
      ('Staging Sample Product 2', 29.90::numeric),
      ('Staging Sample Product 3',  9.90::numeric)
    ) AS v(name, price)
    WHERE NOT EXISTS (
      SELECT 1 FROM "Product" p WHERE p."Name" = v.name
    );

    INSERT INTO "Stock" ("ProductId", "Quantity")
    SELECT p."Id", v.quantity
    FROM (VALUES
      ('Staging Sample Product 1', 100),
      ('Staging Sample Product 2',  50),
      ('Staging Sample Product 3', 200)
    ) AS v(name, quantity)
    JOIN "Product" p ON p."Name" = v.name
    WHERE NOT EXISTS (
      SELECT 1 FROM "Stock" s WHERE s."ProductId" = p."Id"
    );
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seed-mongo-script
  namespace: staging
data:
  seed.js: |
    // Idempotente por upsert, nao por deleteMany — roda a cada sync do ArgoCD
    // (PostSync hook) e nao pode apagar dados de quem estiver usando staging.
    db.reports.updateOne(
      { name: "staging-seed-report-1" },
      { $setOnInsert: { name: "staging-seed-report-1", createdAt: new Date(), synthetic: true } },
      { upsert: true }
    );
    db.reports.updateOne(
      { name: "staging-seed-report-2" },
      { $setOnInsert: { name: "staging-seed-report-2", createdAt: new Date(), synthetic: true } },
      { upsert: true }
    );
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-postgres
  namespace: staging
  annotations:
    # ADR-0023 — PostSync so' dispara depois de todos os recursos do sync estarem
    # Synced E Healthy, ou seja, depois das migrations do EF terem rodado no startup
    # dos pods. BeforeHookCreation apaga o Job da execucao anterior antes de criar a
    # nova, o que torna o seed auto-recuperavel entre syncs (Jobs do Kubernetes nao
    # sao reexecutados depois de Complete ou de esgotar o backoffLimit).
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: seed-postgres
        application: devopsproject-ecommerce
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: seed-postgres
          image: postgres:16-alpine
          # Corrigido em 2026-08-10: PGPASSWORD nao existia (psql falhava sem senha
          # em modo nao-interativo). O secret dpe-stg-app-secrets-stg so tem a
          # connection string combinada em formato ADO.NET (User ID=...;Password=...),
          # que o psql nao entende nativamente (formato/palavras-chave diferentes do
          # libpq conninfo) — extraida aqui via shell antes de chamar psql.
          #
          # Corrigido em 2026-08-17: desde o fix de escaping do Npgsql (terraform
          # secrets.app.tf), o valor vem entre aspas duplas com aspas internas
          # duplicadas (Password="valor com "" se tiver aspas";), padrao ADO.NET —
          # o sed antigo (ate o primeiro ";") pegava a senha errada, incluindo as
          # aspas literais, gerando "password authentication failed" mesmo com a
          # senha certa no Secrets Manager. Extracao em 3 passos: (1) protege aspas
          # internas duplicadas com um marcador, (2) extrai entre as aspas restantes
          # (agora inequivocas), (3) desfaz o marcador.
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD=$(echo "$CONNECTIONSTRINGS__DEFAULT" \
                | sed 's/""/@@Q@@/g' \
                | sed -n 's/.*Password="\([^"]*\)".*/\1/p' \
                | sed 's/@@Q@@/"/g')
              exec psql -f /seed/seed.sql
          envFrom:
            - configMapRef:
                name: dpe-stg-config-map-stg
            - secretRef:
                name: dpe-stg-app-secrets-stg
          env:
            # PGHOST: endpoint do Aurora -stg, recalculado a cada rebuild do cluster
            # e sincronizado aqui pelo `sync-gitops-outputs.sh staging-pghost`, mesmo
            # padrao ja usado pro ARN do certificado ACM (RUNBOOK-deploy-do-zero.md).
            # O identificador do cluster (prefixo antes de ".cluster-") vem fixo do
            # Terraform; o sufixo "cluster-<hash>" e' estavel por conta/regiao AWS,
            # nao aleatorio por cluster — por isso o valor pode repetir identico
            # entre ciclos de teardown+rebuild (confirmado ao vivo em 2026-08-17: o
            # `sync-gitops-outputs.sh` rodou e reportou "nada mudou" porque o valor
            # do ciclo anterior ja batia byte a byte com o novo). Nao e' sinal de
            # falha do script nem de endpoint desatualizado.
            # NAO sensivel (nao e credencial), diferente de PGPASSWORD acima.
            - name: PGHOST
              value: "devopsproject-stg-aurora.cluster-ccf86y6syo4g.us-east-1.rds.amazonaws.com"
            - name: PGDATABASE
              value: "devopsprojectEcommerce"
            - name: PGUSER
              value: "devopsprojectAdmin"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: seed-script
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed-script
          configMap:
            name: dpe-stg-seed-postgres-script-stg
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-mongo
  namespace: staging
  annotations:
    # ADR-0023 — PostSync so' dispara depois de todos os recursos do sync estarem
    # Synced E Healthy, ou seja, depois das migrations do EF terem rodado no startup
    # dos pods. BeforeHookCreation apaga o Job da execucao anterior antes de criar a
    # nova, o que torna o seed auto-recuperavel entre syncs (Jobs do Kubernetes nao
    # sao reexecutados depois de Complete ou de esgotar o backoffLimit).
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: seed-mongo
        application: devopsproject-ecommerce
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: seed-mongo
          image: mongo:7
          # Corrigido em 2026-08-10: nao precisa de placeholder nenhum — o secret
          # dpe-stg-app-secrets-stg ja tem CONNECTIONSTRINGS__MONGO pronta em
          # formato mongodb:// URI (username/senha/host ja embutidos), diferente da
          # connection string do Postgres (formato ADO.NET, precisa de extracao).
          command: ["mongosh"]
          args:
            - "--tls"
            - "--tlsCAFile=/certs/certificate.pem"
            - "$(CONNECTIONSTRINGS__MONGO)"
            - "/seed/seed.js"
          envFrom:
            - configMapRef:
                name: dpe-stg-config-map-stg
            - secretRef:
                name: dpe-stg-app-secrets-stg
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              # Corrigido em 2026-08-10: 128Mi causava OOMKilled — o mongosh
              # moderno (cliente Node.js) precisa de mais memoria que o legado
              # `mongo` shell.
              memory: "192Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          volumeMounts:
            - name: seed-script
              mountPath: /seed
              readOnly: true
            - name: mongo-cert
              mountPath: /certs
              readOnly: true
      volumes:
        - name: seed-script
          configMap:
            name: dpe-stg-seed-mongo-script-stg
        - name: mongo-cert
          secret:
            secretName: dpe-stg-mongo-certificate-stg
