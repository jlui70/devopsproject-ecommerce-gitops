apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dpe-aws-secrets-manager-prod
  target:
    name: dpe-app-secrets-prod
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: devopsproject/app/secrets
