apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # kubeadm self-managed (sem IRSA/EKS Pod Identity) - autenticacao pela
      # cadeia de credenciais padrao do SDK, que resolve para a instance-role
      # do worker EC2 (mesmo caminho SigV4 do Fluent Bit, ADR-0007, IMDS hop=2).
      # Pre-requisito de IAM (fora do GitOps, ver ADR-0013): a policy da
      # instance-role precisa conceder secretsmanager:GetSecretValue nos ARNs
      # necessarios (producao e -stg).
