apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "https://+:4443;http://+:8080"
  ASPNETCORE_KESTREL__CERTIFICATES__DEFAULT__PATH: "/dpe-backend/certificates/kestrel/tls.crt"
  ASPNETCORE_KESTREL__CERTIFICATES__DEFAULT__KEYPATH: "/dpe-backend/certificates/kestrel/tls.key"

  BASEADDRESS__MAIN: "http://dpe-main-prod.dpe.svc.cluster.local:8080/main"
  BASEADDRESS__IDENTITY: "http://dpe-identity-server-prod.dpe.svc.cluster.local:8080/identity"
  BASEADDRESS__ORDER: "http://dpe-order-prod.dpe.svc.cluster.local:8080/order"

  LOCALSTACK__ISENABLED: "false"

  MONGO__DATABASE: "devopsprojectEcommerce"
  MONGO__REPORT_COLLECTION: "reports"
  MONGO_CERTIFICATE_CONTAINER_PATH: "/dpe-backend/certificates/mongo/certificate.pem"

  # CONNECTIONSTRINGS__DEFAULT e CONNECTIONSTRINGS__MONGO estao no Secret dpe-app-secrets-prod (via ESO)

  AWSS3PARAMS01__BUCKETNAME: "devopsproject-application-bucket"
  AWSS3PARAMS01__URIEXPIRATIONMINUTES: "60"

  IDENTITY__ISSUER: "https://ecommerce-devopsproject.com/identity"
  IDENTITY__AUDIENCE: "https://ecommerce-devopsproject.com"
  IDENTITY__TOKENLIFETIME: "60"
  # IDENTITY__KEY e IDENTITY__ADMIN__USER__PASSWORD estao no Secret dpe-app-secrets-prod (via ESO)
  IDENTITY__ADMIN__USER: "admin@ecommerce-devopsproject.com"

  # ADR/Apendice A.18 — health checks internos usam DNS do cluster, nao a URL publica.
  # Pela URL publica a requisicao sai pelo NAT (us-east-1) e o proprio WAF do projeto a
  # bloqueia: a regra `geo-non-br` rotula todo trafego fora do Brasil como suspeito e a
  # regra `block-suspicious-by-label` devolve 403. Resultado: os 6 checks apareciam
  # Unhealthy com todos os servicos saudaveis. Mesmo padrao ja usado em BASEADDRESS__*.
  HEALTHCHECKSUI__HEALTHCHECKS__0__NAME: "Postgresql"
  HEALTHCHECKSUI__HEALTHCHECKS__0__URI: "http://dpe-health-checker-prod.dpe.svc.cluster.local:8080/healthchecks/health"
  HEALTHCHECKSUI__HEALTHCHECKS__1__NAME: "Main"
  HEALTHCHECKSUI__HEALTHCHECKS__1__URI: "http://dpe-main-prod.dpe.svc.cluster.local:8080/main/health"
  HEALTHCHECKSUI__HEALTHCHECKS__2__NAME: "Order"
  HEALTHCHECKSUI__HEALTHCHECKS__2__URI: "http://dpe-order-prod.dpe.svc.cluster.local:8080/order/health"
  HEALTHCHECKSUI__HEALTHCHECKS__3__NAME: "Notificator"
  HEALTHCHECKSUI__HEALTHCHECKS__3__URI: "http://dpe-notificator-prod.dpe.svc.cluster.local:8080/notificator/health"
  HEALTHCHECKSUI__HEALTHCHECKS__4__NAME: "Identity Server"
  HEALTHCHECKSUI__HEALTHCHECKS__4__URI: "http://dpe-identity-server-prod.dpe.svc.cluster.local:8080/identity/health"
  HEALTHCHECKSUI__HEALTHCHECKS__5__NAME: "Invoice Generator"
  HEALTHCHECKSUI__HEALTHCHECKS__5__URI: "http://dpe-invoice-generator-prod.dpe.svc.cluster.local:8080/invoice/health"

  NOTIFICATOR__AWSSQSQUEUEMONITORPARAMS01__QUEUENAME: "EmailNotificationQueue"
  NOTIFICATOR__AWSSQSQUEUEMONITORPARAMS01__QUEUEOWNERAWSACCOUNTID: "692430448478"
  NOTIFICATOR__AWSSQSQUEUEMONITORPARAMS01__MAXNUMBEROFMESSAGES: "10"
  NOTIFICATOR__AWSSQSQUEUEMONITORPARAMS01__WAITTIMESECONDS: "10"
  NOTIFICATOR__AWSSQSQUEUEMONITORPARAMS01__MSGPROCESSORSERVICENAME: "AwsSesEmailSenderProcessor"
  NOTIFICATOR__AWSSQSQUEUEMONITORPARAMS01__MILLISECONDSDELAY: "1000"
  NOTIFICATOR__EMAILCONFIGURATION__FROM: "support@ecommerce-devopsproject.com"
  NOTIFICATOR__EMAILCONFIGURATION__TO: "luiz7030@gmail.com"
  NOTIFICATOR__EMAILCONFIGURATION__SESTEMPLATE: "order-confirmed-template"

  MAIN__AWSSQSQUEUEMONITORPARAMS01__QUEUENAME: "ProductStockQueue"
  MAIN__AWSSQSQUEUEMONITORPARAMS01__QUEUEOWNERAWSACCOUNTID: "692430448478"
  MAIN__AWSSQSQUEUEMONITORPARAMS01__MAXNUMBEROFMESSAGES: "10"
  MAIN__AWSSQSQUEUEMONITORPARAMS01__WAITTIMESECONDS: "10"
  MAIN__AWSSQSQUEUEMONITORPARAMS01__MSGPROCESSORSERVICENAME: "ProductStockProcessor"
  MAIN__AWSSQSQUEUEMONITORPARAMS01__MILLISECONDSDELAY: "1000"

  ORDER__AWSSQSMESSAGESENDERPARAMS01__QUEUENAME: "EmailNotificationQueue"
  ORDER__AWSSQSMESSAGESENDERPARAMS01__QUEUEOWNERAWSACCOUNTID: "692430448478"
  ORDER__AWSSQSMESSAGESENDERPARAMS01__ISFIFO: "false"
  ORDER__AWSSQSMESSAGESENDERPARAMS01__ENABLEMESSAGEDEDUPLICATION: "false"
  ORDER__AWSSQSMESSAGESENDERPARAMS02__QUEUENAME: "ProductStockQueue"
  ORDER__AWSSQSMESSAGESENDERPARAMS02__QUEUEOWNERAWSACCOUNTID: "692430448478"
  ORDER__AWSSQSMESSAGESENDERPARAMS02__ISFIFO: "false"
  ORDER__AWSSQSMESSAGESENDERPARAMS02__ENABLEMESSAGEDEDUPLICATION: "false"

  INVOICEGENERATOR__AWSSQSQUEUEMONITORPARAMS01__QUEUENAME: "InvoiceQueue"
  INVOICEGENERATOR__AWSSQSQUEUEMONITORPARAMS01__QUEUEOWNERAWSACCOUNTID: "692430448478"
  INVOICEGENERATOR__AWSSQSQUEUEMONITORPARAMS01__MAXNUMBEROFMESSAGES: "10"
  INVOICEGENERATOR__AWSSQSQUEUEMONITORPARAMS01__WAITTIMESECONDS: "10"
  INVOICEGENERATOR__AWSSQSQUEUEMONITORPARAMS01__MSGPROCESSORSERVICENAME: "InvoiceProcessor"
  INVOICEGENERATOR__AWSSQSQUEUEMONITORPARAMS01__MILLISECONDSDELAY: "1000"
  INVOICEGENERATOR__AWSSQSMESSAGESENDERPARAMS01__QUEUENAME: "EmailNotificationQueue"
  INVOICEGENERATOR__AWSSQSMESSAGESENDERPARAMS01__QUEUEOWNERAWSACCOUNTID: "692430448478"
  INVOICEGENERATOR__AWSSQSMESSAGESENDERPARAMS01__ISFIFO: "false"
  INVOICEGENERATOR__AWSSQSMESSAGESENDERPARAMS01__ENABLEMESSAGEDEDUPLICATION: "false"
