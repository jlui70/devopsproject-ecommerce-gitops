apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.mainDeployment.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      application: devopsproject-ecommerce
  strategy:
    blueGreen:
      activeService: {{ .Values.mainDeployment.activeServiceName }}
      previewService: {{ .Values.mainDeployment.previewServiceName }}
      autoPromotionEnabled: {{ .Values.mainDeployment.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: 300
      abortScaleDownDelaySeconds: 30
      prePromotionAnalysis:
        templates:
        - templateName: {{ .Values.mainDeployment.blueGreen.analysisTemplateName }}
        args:
        # O namespace vem dos values, NAO de `.Release.Namespace`: quem renderiza este
        # chart e o argocd-repo-server, e o Helm resolve `.Release.Namespace` pelo
        # namespace do proprio pod (`argocd`), gerando uma URL que nao resolve
        # (`...preview-prod.argocd.svc.cluster.local`). O `kustomize build` local
        # resolve para o namespace certo, entao a divergencia so aparece no cluster.
        # Achado ao vivo em 2026-08-24: os 3 Rollouts abortaram com
        # `consecutiveErrors (5) > consecutiveErrorLimit (4)` e o cutover blue/green
        # nunca aconteceu — producao seguiu servindo a revisao anterior. So aparece a
        # partir da 2a revisao: o Argo Rollouts pula prePromotionAnalysis na primeira.
        # O FQDN e obrigatorio: a metrica `web` e executada pelo controller do Argo
        # Rollouts, que roda em outro namespace.
        - name: url
          value: https://{{ .Values.mainDeployment.previewServiceName }}.{{ .Values.mainDeployment.namespace }}.svc.cluster.local:{{ .Values.mainDeployment.containerPort }}/main/health
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        application: devopsproject-ecommerce
    spec:
      topologySpreadConstraints:
      {{- range .Values.mainDeployment.topologySpreadConstraints }}
      - maxSkew: {{ .maxSkew }}
        topologyKey: {{ .topologyKey }}
        whenUnsatisfiable: {{ .whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            app: {{ $.Release.Name }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Release.Name }}
                topologyKey: kubernetes.io/hostname
      securityContext:
        {{- toYaml .Values.mainDeployment.securityContext | nindent 8 }}
      serviceAccount: {{ .Values.mainDeployment.serviceAccount }}
      volumes:
        {{- toYaml .Values.mainDeployment.volumes | nindent 6 }}
      imagePullSecrets:
      - name: {{ .Values.mainDeployment.imagePullSecrets }}
      containers:
      - name: {{ .Release.Name }}
        image: {{ .Values.mainDeployment.image }}
        ports:
        - containerPort: {{ .Values.mainDeployment.containerPort }}
        envFrom:
        - configMapRef:
            name: {{ .Values.mainDeployment.configMap }}
        - secretRef:
            name: {{ .Values.mainDeployment.secret }}
        volumeMounts:
          {{- toYaml .Values.mainDeployment.volumeMounts | nindent 8 }}
        resources:
          {{- toYaml .Values.mainDeployment.resources | nindent 10 }}
        startupProbe:
          {{- toYaml .Values.mainDeployment.startupProbe | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.mainDeployment.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.mainDeployment.readinessProbe | nindent 10 }}
