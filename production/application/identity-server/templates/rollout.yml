apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.identityServerDeployment.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      application: devopsproject-ecommerce
  strategy:
    blueGreen:
      activeService: {{ .Values.identityServerDeployment.activeServiceName }}
      previewService: {{ .Values.identityServerDeployment.previewServiceName }}
      autoPromotionEnabled: {{ .Values.identityServerDeployment.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: 300
      abortScaleDownDelaySeconds: 30
      prePromotionAnalysis:
        templates:
        - templateName: {{ .Values.identityServerDeployment.blueGreen.analysisTemplateName }}
        args:
        # O namespace vem dos values, NAO de `.Release.Namespace`: quem renderiza este
        # chart e o argocd-repo-server, e o Helm resolve `.Release.Namespace` pelo
        # namespace do proprio pod (`argocd`), gerando uma URL que nao resolve
        # (`...preview-prod.argocd.svc.cluster.local`). O `kustomize build` local
        # resolve para o namespace certo, entao a divergencia so aparece no cluster.
        # Achado ao vivo em 2026-08-24: os 3 Rollouts abortaram com
        # `consecutiveErrors (5) > consecutiveErrorLimit (4)` e o cutover blue/green
        # nunca aconteceu — producao seguiu servindo a revisao anterior. So aparece a
        # partir da 2a revisao: o Argo Rollouts pula prePromotionAnalysis na primeira.
        # O FQDN e obrigatorio: a metrica `web` e executada pelo controller do Argo
        # Rollouts, que roda em outro namespace.
        - name: url
          value: https://{{ .Values.identityServerDeployment.previewServiceName }}.{{ .Values.identityServerDeployment.namespace }}.svc.cluster.local:{{ .Values.identityServerDeployment.containerPort }}/identity/health
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        application: devopsproject-ecommerce
    spec:
      topologySpreadConstraints:
      {{- range .Values.identityServerDeployment.topologySpreadConstraints }}
      - maxSkew: {{ .maxSkew }}
        topologyKey: {{ .topologyKey }}
        whenUnsatisfiable: {{ .whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            app: {{ $.Release.Name }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ .Release.Name }}
                topologyKey: kubernetes.io/hostname
      securityContext:
        {{- toYaml .Values.identityServerDeployment.securityContext | nindent 8 }}
      serviceAccount: {{ .Values.identityServerDeployment.serviceAccount }}
      volumes:
        {{- toYaml .Values.identityServerDeployment.volumes | nindent 6 }}
      imagePullSecrets:
      - name: {{ .Values.identityServerDeployment.imagePullSecrets }}
      containers:
      - name: {{ .Release.Name }}
        image: {{ .Values.identityServerDeployment.image }}
        ports:
        - containerPort: {{ .Values.identityServerDeployment.containerPort }}
        envFrom:
        - configMapRef:
            name: {{ .Values.identityServerDeployment.configMap }}
        - secretRef:
            name: {{ .Values.identityServerDeployment.secret }}
        volumeMounts:
          {{- toYaml .Values.identityServerDeployment.volumeMounts | nindent 8 }}
        resources:
          {{- toYaml .Values.identityServerDeployment.resources | nindent 10 }}
        startupProbe:
          {{- toYaml .Values.identityServerDeployment.startupProbe | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.identityServerDeployment.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.identityServerDeployment.readinessProbe | nindent 10 }}
