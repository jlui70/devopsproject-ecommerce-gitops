identityServerDeployment:
  image: 692430448478.dkr.ecr.us-east-1.amazonaws.com/devopsproject/prod/identity-server
  containerPort: 4443
  nodePort: 30004
  previewNodePort: 30008
  activeServiceName: dpe-identity-server-prod
  previewServiceName: dpe-identity-server-preview-prod
  blueGreen:
    autoPromotionEnabled: true
    # ADR-0013 — nome do AnalysisTemplate (base/analysis-template.yml) pos
    # prefixo/sufixo do Kustomize deste overlay. Overlay staging/ sobrescreve
    # via valuesInline com o nome correspondente ao seu proprio namePrefix.
    analysisTemplateName: dpe-health-check-prod
  configMap: dpe-config-map-prod
  secret: dpe-app-secrets-prod
  replicaCount: 2
  serviceAccount: dpe-sa-prod
  imagePullSecrets: dpe-ecr-image-pull-credentials-prod
  autoScaling:
    minReplicas: 2
    maxReplicas: 3
    averageCpuUtilization: 50
    scaleDown:  
      stabilizationWindowSeconds: 15
      policies:
      - type: Pods
        value: 2
        periodSeconds: 15
      - type: Percent
        value: 50
        periodSeconds: 15
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  volumes:
  - name: kestrel
    secret:
      secretName: dpe-kestrel-certificate-prod
  volumeMounts: 
  - name: kestrel
    readOnly: true
    mountPath: /dpe-backend/certificates/kestrel
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  startupProbe:
    httpGet:
      path: /identity/health
      port: 8080
      scheme: HTTP
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    httpGet:
      path: /identity/health
      port: 8080
      scheme: HTTP
    successThreshold: 1
    failureThreshold: 3
    initialDelaySeconds: 0
    timeoutSeconds: 15
    periodSeconds: 60
  readinessProbe:
    httpGet:
      path: /identity/health
      port: 8080
      scheme: HTTP
    successThreshold: 1
    failureThreshold: 3
    initialDelaySeconds: 3
    timeoutSeconds: 15
    periodSeconds: 3