orderDeployment:
  image: 692430448478.dkr.ecr.us-east-1.amazonaws.com/devopsproject/prod/order
  containerPort: 4443
  nodePort: 30000
  previewNodePort: 30001
  activeServiceName: dpe-order-prod
  previewServiceName: dpe-order-preview-prod
  blueGreen:
    autoPromotionEnabled: true
  configMap: dpe-config-map-prod
  secret: dpe-app-secrets-prod
  replicaCount: 1
  serviceAccount: dpe-sa-prod
  imagePullSecrets: dpe-ecr-image-pull-credentials-prod
  autoScaling:
    minReplicas: 1
    maxReplicas: 3
    averageCpuUtilization: 50
    scaleDown:  
      stabilizationWindowSeconds: 15
      policies:
      - type: Pods
        value: 2
        periodSeconds: 15
      - type: Percent
        value: 50
        periodSeconds: 15
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  volumes:
  - name: kestrel
    secret:
      secretName: dpe-kestrel-certificate-prod
  volumeMounts: 
  - name: kestrel
    readOnly: true
    mountPath: /dpe-backend/certificates/kestrel
  resources:
    requests:
      memory: "256Mi"
      cpu: "256m"
    limits:
      memory: "256Mi"
      cpu: "256m"
  startupProbe:
    httpGet:
      path: /order/health
      port: 8080
      scheme: HTTP
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    httpGet:
      path: /order/health
      port: 8080
      scheme: HTTP
    successThreshold: 1
    failureThreshold: 3
    initialDelaySeconds: 0
    timeoutSeconds: 15
    periodSeconds: 60
  readinessProbe:
    httpGet:
      path: /order/health
      port: 8080
      scheme: HTTP
    successThreshold: 1
    failureThreshold: 3
    initialDelaySeconds: 3
    timeoutSeconds: 15
    periodSeconds: 3